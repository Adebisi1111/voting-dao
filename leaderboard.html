<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VotingDAO — Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0c;
      --text: #ffffff;
      --muted: #9e9e9e;
      --blue: #006cd2;
      --blue-dark: #0053a3;
      --hairline: rgba(255,255,255,0.065);
      --font: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --pad-x: clamp(20px, 3.52vw, 64px);
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    /* Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: clamp(20px, 5vw, 56px);
      padding: 1rem 2rem;
      background: rgba(12,12,12,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--hairline);
    }

    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-text { font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -0.5px; text-transform: lowercase; }

    .nav-links { display: flex; gap: 34px; align-items: center; }
    .nav-links a { font-weight: 700; font-size: 0.875rem; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; text-transform: uppercase; }
    .nav-links a:hover { color: var(--blue); }

    .spacer { flex: 1; }

    .wallet-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue);
      border: none;
      color: #fff;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 10px 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .wallet-btn:hover { background: #6BA0FF; }
    .wallet-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .wallet-btn.connected { background: #10b981; }

    @media (max-width: 700px) {
      .nav-links { display: none; }
    }

    /* Main */
    .main {
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(40px, 6vh, 60px) var(--pad-x);
    }

    .page-header {
      text-align: center;
      margin-bottom: clamp(30px, 4vh, 40px);
    }

    .page-header h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .page-header p {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Leaderboard Table */
    .leaderboard {
      background: #111111;
      border: 1px solid var(--hairline);
      overflow: hidden;
    }

    .leaderboard-header {
      display: grid;
      grid-template-columns: 60px 1fr 100px 100px 100px;
      padding: 1rem 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--hairline);
    }

    .leaderboard-row {
      display: grid;
      grid-template-columns: 60px 1fr 100px 100px 100px;
      padding: 1rem 1.5rem;
      align-items: center;
      border-bottom: 1px solid var(--hairline);
      transition: background 0.2s;
    }

    .leaderboard-row:hover { background: rgba(255,255,255,0.02); }
    .leaderboard-row:last-child { border-bottom: none; }

    .rank { font-weight: 700; color: var(--muted); }
    .rank.top { color: #ffd400; }

    .user { display: flex; align-items: center; gap: 0.75rem; }
    .user-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), #8B5CF6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
    .user-name { font-weight: 600; font-size: 0.9rem; }
    .user-address { font-size: 0.75rem; color: var(--muted); font-family: monospace; }

    .stat { font-weight: 600; font-size: 0.9rem; text-align: center; }
    .stat-label-sm { font-size: 0.7rem; color: var(--muted); text-align: center; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }

    /* Footer */
    footer { border-top: 1px solid var(--hairline); padding: 2rem; text-align: center; font-size: 0.75rem; color: var(--muted); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--blue); }

    @media (max-width: 768px) {
      .leaderboard-header, .leaderboard-row { grid-template-columns: 40px 1fr 80px; }
      .leaderboard-header > *:nth-child(4), .leaderboard-header > *:nth-child(5),
      .leaderboard-row > *:nth-child(4), .leaderboard-row > *:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <span class="nav-logo-text">votingdao<span style="font-weight:400;color:rgba(255,255,255,0.5)">.io</span></span>
  </a>

  <div class="nav-links">
    <a href="index.html#how-it-works">How It Works</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="index.html#faq">FAQ</a>
  </div>

  <div class="spacer"></div>

  <button id="walletBtn" class="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
</nav>

<main class="main">
  <div class="page-header">
    <h1>Leaderboard</h1>
    <p>Top voters and proposal creators on VotingDAO</p>
  </div>

  <div class="leaderboard">
    <div class="leaderboard-header">
      <div>#</div>
      <div>Voter</div>
      <div>Votes Cast</div>
      <div>Proposals</div>
      <div>Success Rate</div>
    </div>
    <div id="leaderboardList">
      <div class="loading">Connect wallet to view leaderboard</div>
    </div>
  </div>
</main>

<footer>
  <div style="margin-bottom:0.5rem"><a href="https://github.com/Adebisi1111/voting-dao" target="_blank">GitHub</a> · <a href="index.html">Home</a> · <a href="app.html">App</a></div>
  <div>© 2026 VotingDAO — Built on GenLayer</div>
  <div style="margin-top:0.5rem;opacity:0.7">Contract: 0x8BAB49CF18Cf129977b7d12BF0558357b358113e</div>
</footer>

<script type="module">
import { createClient, chains } from 'https://cdn.jsdelivr.net/npm/genlayer-js@latest/+esm';

const CONTRACT = '0x8BAB49CF18Cf129977b7d12BF0558357b358113e';
const BRADBURY_CHAIN_ID = '0x107D';

let client = null;
let account = null;

window.connectWallet = connectWallet;

function detectWallet() {
  if (typeof window === 'undefined') return null;
  if (window.rabby) return window.rabby.provider || window.ethereum;
  if (window.ethereum?.isRabby) return window.ethereum;
  if (window.ethereum?.isMetaMask) return window.ethereum;
  if (window.ethereum) return window.ethereum;
  return null;
}

async function connectWallet() {
  const btn = document.getElementById('walletBtn');
  btn.disabled = true;
  btn.textContent = 'Connecting...';

  try {
    const provider = detectWallet();
    if (!provider) {
      alert('No wallet detected. Please install MetaMask or Rabby.');
      btn.disabled = false;
      btn.textContent = 'Connect Wallet';
      return;
    }

    const currentChainId = await provider.request({ method: 'eth_chainId' });
    if (currentChainId !== BRADBURY_CHAIN_ID) {
      try {
        await provider.request({
          method: 'wallet_switchEthereumChain',
          params: [{ chainId: BRADBURY_CHAIN_ID }],
        });
      } catch (switchError) {
        if (switchError.code === 4902) {
          await provider.request({
            method: 'wallet_addEthereumChain',
            params: [{
              chainId: BRADBURY_CHAIN_ID,
              chainName: 'GenLayer Bradbury Testnet',
              rpcUrls: ['https://rpc-bradbury.genlayer.com'],
              nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 },
              blockExplorerUrls: ['https://explorer-bradbury.genlayer.com'],
            }],
          });
        } else {
          throw switchError;
        }
      }
    }

    const accounts = await provider.request({ method: 'eth_requestAccounts' });
    if (!accounts || accounts.length === 0) {
      alert('No accounts found. Please unlock your wallet.');
      btn.disabled = false;
      btn.textContent = 'Connect Wallet';
      return;
    }

    account = accounts[0];
    client = createClient({ chain: chains.testnetBradbury, account });

    btn.textContent = account.slice(0, 6) + '...' + account.slice(-4);
    btn.classList.add('connected');
    btn.disabled = false;

    await loadLeaderboard();

  } catch (err) {
    console.error('Connection failed:', err);
    alert('Connection failed: ' + (err.message || 'Unknown error'));
    btn.disabled = false;
    btn.textContent = 'Connect Wallet';
  }
}

async function loadLeaderboard() {
  const list = document.getElementById('leaderboardList');
  list.innerHTML = '<div class="loading">Loading leaderboard...</div>';

  try {
    // Get total proposals
    const count = await client.readContract({
      address: CONTRACT,
      functionName: 'get_proposals_count',
      args: [],
    });

    if (parseInt(count) === 0) {
      list.innerHTML = '<div class="loading">No proposals yet</div>';
      return;
    }

    // Read all proposals to get real data
    let proposals = [];
    for (let i = 0; i < parseInt(count); i++) {
      try {
        const p = await client.readContract({
          address: CONTRACT,
          functionName: 'get_proposal',
          args: ['prop-00' + (i + 1)],
        });
        const proposal = JSON.parse(p);
        if (proposal.exists) proposals.push(proposal);
      } catch (e) {}
    }

    // Count votes per creator
    const creatorVotes = {};
    let totalVotes = 0;
    proposals.forEach(p => {
      const total = p.yes_votes + p.no_votes;
      totalVotes += total;
      if (p.creator) {
        if (!creatorVotes[p.creator]) creatorVotes[p.creator] = 0;
        creatorVotes[p.creator] += total;
      }
    });

    // Known addresses to check
    const knownVoters = [
      { address: '0x782abaE1C6C4aec093C964785a4c10C0991Fa01A', name: 'You' },
    ];

    let rows = [];
    for (const voter of knownVoters) {
      try {
        const registered = await client.readContract({
          address: CONTRACT,
          functionName: 'is_voter',
          args: [voter.address],
        });
        if (registered === 'true') {
          rows.push({
            ...voter,
            votes: creatorVotes[voter.address] || 0,
            proposals: proposals.filter(p => p.creator === voter.address).length,
            success: 100,
          });
        }
      } catch (e) {}
    }

    if (rows.length === 0) {
      list.innerHTML = '<div class="loading">No registered voters found</div>';
      return;
    }

    // Sort by votes
    rows.sort((a, b) => b.votes - a.votes);

    let html = '';
    rows.forEach((row, i) => {
      const rankClass = i < 3 ? 'rank top' : 'rank';
      html += '<div class="leaderboard-row">' +
        '<div class="' + rankClass + '">' + (i + 1) + '</div>' +
        '<div class="user">' +
          '<div class="user-avatar">0x</div>' +
          '<div>' +
            '<div class="user-name">' + row.name + '</div>' +
            '<div class="user-address">' + row.address.slice(0, 6) + '...' + row.address.slice(-4) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="stat">' + row.votes + '</div>' +
        '<div class="stat">' + row.proposals + '</div>' +
        '<div class="stat">' + row.success + '%</div>' +
      '</div>';
    });
    list.innerHTML = html;

  } catch (err) {
    list.innerHTML = '<div class="loading">Error loading leaderboard: ' + err.message + '</div>';
  }
}
</script>

</body>
</html>
